[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/valnabi/pactum"
publish = false

[workspace.dependencies]
pactum-journal = { path = "crates/pactum-journal" }
pactum-core = { path = "crates/pactum-core" }
pactum-sqlite = { path = "crates/pactum-sqlite" }
pactum-messaging = { path = "crates/pactum-messaging" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
